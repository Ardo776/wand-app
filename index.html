<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wand-Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e8eaf0;
    --muted: #8b92a3;
    --accent: #6ea8fe;
    --exam: #ff7a7a;
    --due: #ffc266;
    --appt: #7fd6a4;
    --done: #555c6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body.night { filter: brightness(0.6); }
  .app { display: flex; height: 100%; }

  /* ---------- Kalender-Sidebar ---------- */
  .side { width: 34%; min-width: 300px; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; touch-action: pan-y; }
  .side-head { padding: 22px 22px 12px; display: flex; align-items: center; gap: 10px; }
  .side-head .day { flex: 1; }
  .side-head .wd { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .side-head .dt { font-size: 26px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .nav { width: 46px; height: 46px; border-radius: 23px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 22px; line-height: 44px; text-align: center; }
  .nav:active { background: var(--line); }
  .today-btn { font-size: 13px; color: var(--accent); padding: 0 22px 10px; min-height: 26px; }
  .strip { display: flex; padding: 0 14px 14px; gap: 6px; }
  .strip div { flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; color: var(--muted); font-size: 13px; }
  .strip div b { display: block; font-size: 18px; color: var(--text); font-weight: 500; margin-top: 2px; }
  .strip div.sel { background: var(--accent); color: #0b1020; }
  .strip div.sel b { color: #0b1020; }
  .strip div .dot { display: block; width: 5px; height: 5px; border-radius: 3px; margin: 4px auto 0; background: transparent; }
  .strip div .dot.on { background: var(--muted); }
  .events { flex: 1; overflow-y: auto; padding: 4px 18px 18px; }
  .ev { display: flex; gap: 12px; padding: 12px 12px; margin-bottom: 8px; border-radius: 12px; background: var(--panel-2);
    border-left: 4px solid var(--accent); }
  .ev .t { width: 56px; font-size: 14px; color: var(--muted); flex-shrink: 0; }
  .ev .t b { display: block; color: var(--text); font-size: 16px; font-weight: 600; }
  .ev .n { font-size: 17px; line-height: 1.3; }
  .ev .c { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ev.past { opacity: .45; }
  .ev.now { box-shadow: 0 0 0 1px var(--accent) inset; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 15px; }

  /* ---------- Hauptbereich ---------- */
  .main { flex: 1; display: flex; flex-direction: column; padding: 22px 26px; min-width: 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .clock { font-size: 64px; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  .greet { font-size: 17px; color: var(--muted); text-align: right; }
  .greet b { color: var(--text); font-weight: 500; display: block; font-size: 20px; }
  .grid { flex: 1; display: flex; gap: 18px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px;
    display: flex; flex-direction: column; min-height: 0; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .1em; display: flex; justify-content: space-between; }
  .card h2 span { color: var(--text); letter-spacing: 0; }
  .todos { flex: 1.35; }
  .deadlines { flex: 1.2; }
  .rightcol { flex: 1; display: flex; flex-direction: column; gap: 18px; min-height: 0; min-width: 0; }
  .goals { flex: 1; }
  .spend { flex: none; padding-bottom: 14px; }
  .spend .big { font-size: 28px; font-weight: 600; line-height: 1.1; color: var(--accent); white-space: nowrap; }
  .spend .big small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .spend .bar { height: 12px; border-radius: 6px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .spend .bar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
  .spend .sv { font-size: 15px; color: var(--muted); margin-top: 8px; }
  .spend.warn .big, .spend.warn .sv b { color: var(--due, #ffc266); }
  .spend.warn .bar i { background: var(--due, #ffc266); }
  .spend.over .big, .spend.over .sv b { color: var(--exam); }
  .spend.over .bar i { background: var(--exam); }
  .spend .orders { display: none; margin-top: 10px; max-height: 190px; overflow-y: auto; }
  .spend.open .orders { display: block; }
  .spend .o { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 5px 0; border-top: 1px solid var(--line); }
  .spend .o span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spend .o span:last-child { flex-shrink: 0; white-space: nowrap; }
  .spend .o i { font-style: normal; color: var(--muted); }
  .spend .o.back span:last-child { color: var(--muted); }
  .grow2 { display: flex; gap: 8px; margin-top: 8px; }
  .grow2 input { min-width: 0; flex: 1; }
  .goal { padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .goal:last-child { border-bottom: 0; }
  .goal .gt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .goal .gn { font-size: 18px; line-height: 1.3; }
  .goal .gp { font-size: 22px; font-weight: 600; color: var(--appt); flex-shrink: 0; }
  .goal .gv { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .goal .bar { height: 12px; border-radius: 6px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .goal .bar i { display: block; height: 100%; border-radius: 6px; background: var(--appt); }
  .goal.full .gp, .goal.full .bar i { color: var(--accent); }
  .goal.full .bar i { background: var(--accent); }
  .goal .gv.late { color: var(--exam); }
  .goal .next { font-size: 15px; color: var(--muted); margin-top: 10px; }
  .goal .next b { color: var(--text); font-weight: 500; }
  .goal .step { display: flex; align-items: center; gap: 12px; padding: 10px 0 2px; font-size: 16px; line-height: 1.3; }
  .goal .step .box { width: 22px; height: 22px; border-radius: 7px; margin: 0; }
  .goal .step.done { color: var(--done); text-decoration: line-through; }
  .goal .step.done .box { background: var(--done); border-color: var(--done); }
  .goal .steps { display: none; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .goal.open .steps { display: flex; }
  .list { overflow-y: auto; flex: 1; }
  .todo { display: flex; align-items: flex-start; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: 0; }
  .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); flex-shrink: 0; margin-top: 1px; }
  .todo.done .box { background: var(--done); border-color: var(--done); }
  .todo .txt { font-size: 19px; line-height: 1.3; }
  .todo.done .txt { color: var(--done); text-decoration: line-through; }
  .todo .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .todo .meta.late { color: var(--exam); }
  .todo.prio .txt::before { content: "!"; color: var(--exam); font-weight: 700; margin-right: 6px; }
  .dl { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dl:last-child { border-bottom: 0; }
  .cd { width: 62px; text-align: center; border-radius: 12px; padding: 7px 0; background: var(--panel-2); flex-shrink: 0; }
  .cd b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
  .cd small { font-size: 11px; color: var(--muted); }
  .dl.exam .cd b { color: var(--exam); }
  .dl.due .cd b { color: var(--due); }
  .dl.appt .cd b { color: var(--appt); }
  .dl .n { font-size: 17px; line-height: 1.3; }
  .dl .c { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-right: 6px; background: var(--panel-2); }
  .add-btn { width: 40px; height: 40px; margin: -10px -6px -10px 12px; border-radius: 20px; background: var(--accent); color: #0b1020;
    font-size: 26px; line-height: 38px; text-align: center; letter-spacing: 0; font-weight: 400; flex-shrink: 0; }
  .card h2 .grow { flex: 1; color: var(--muted); letter-spacing: .1em; }
  .addrow { display: none; margin-bottom: 10px; }
  .addrow.open { display: block; }
  .addrow input { width: 100%; font-size: 19px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); outline: none; -webkit-user-select: text; user-select: text; }
  .addrow input:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip.sel { border-color: var(--accent); color: var(--text); }
  .chip.ok { background: var(--accent); color: #0b1020; border-color: var(--accent); margin-left: auto; font-weight: 600; }
  .foot { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: right; }
  .foot .err { color: var(--due); }

  #saver { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 20; overflow: hidden; }
  #saver img, #saver video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s; }
  #saver .on { opacity: 1; }
  #saverClock { position: absolute; right: 28px; bottom: 20px; font-size: 44px; font-weight: 300; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #setup { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8, 9, 12, .94); overflow-y: auto; z-index: 10; }
  .sbox { max-width: 560px; margin: 6vh auto; padding: 0 22px 40px; }
  .sbox h1 { font-size: 26px; margin: 0 0 6px; }
  .sbox p { color: var(--muted); margin: 0 0 18px; }
  .sbox label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .sbox input { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); outline: none; -webkit-user-select: text; user-select: text; }
  .sbox input:focus { border-color: var(--accent); }
  #sMsg { color: var(--due); min-height: 22px; margin: 14px 0; font-size: 15px; line-height: 1.4; }
  .srow { display: flex; gap: 10px; }
  .srow .chip { font-size: 16px; padding: 12px 18px; }
  .srow .chip.ok { margin-left: 0; }

  /* Hochformat */
  @media (orientation: portrait) {
    .app { flex-direction: column; }
    .side { width: 100%; height: 42%; border-right: 0; border-bottom: 1px solid var(--line); }
    .grid { flex-direction: column; }
    .clock { font-size: 48px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="nav" id="prev">&#8249;</div>
      <div class="day"><div class="wd" id="wd"></div><div class="dt" id="dt"></div></div>
      <div class="nav" id="next">&#8250;</div>
    </div>
    <div class="today-btn" id="todayBtn"></div>
    <div class="strip" id="strip"></div>
    <div class="events" id="events"></div>
  </aside>

  <main class="main">
    <div class="top">
      <div class="clock" id="clock">--:--</div>
      <div class="greet" id="greet"></div>
    </div>
    <div class="grid">
      <section class="card todos" style="display:none">
        <h2><span class="grow">To-dos</span> <span id="todoCount"></span><div class="add-btn" id="addBtn">+</div></h2>
        <div class="addrow" id="addRow">
          <input id="addText" type="text" placeholder="Neues To-do …" autocomplete="off" enterkeyhint="done">
          <div class="chips" id="addChips">
            <div class="chip sel" data-d="">ohne Datum</div><div class="chip" data-d="0">heute</div>
            <div class="chip" data-d="1">morgen</div><div class="chip" data-d="7">in 1 Woche</div>
            <div class="chip ok" id="addOk">Hinzufügen</div>
          </div>
        </div>
        <div class="list" id="todos"></div>
      </section>
      <section class="card deadlines">
        <h2>Prüfungen &amp; Fristen</h2>
        <div class="list" id="deadlines"></div>
      </section>
      <div class="rightcol">
      <section class="card spend" id="spendCard" style="display:none">
        <h2>Bestellungen <span id="spendMonth"></span></h2>
        <div id="spend"></div>
      </section>
      <section class="card goals">
        <h2><span class="grow">Ziele</span><div class="add-btn" id="goalAdd">+</div></h2>
        <div class="addrow" id="goalForm">
          <input id="gTitle" type="text" placeholder="Ziel, z. B. Pissgroschen" autocomplete="off">
          <div class="grow2">
            <input id="gCurrent" type="number" inputmode="decimal" placeholder="Stand jetzt">
            <input id="gTarget" type="number" inputmode="decimal" placeholder="Ziel">
            <input id="gUnit" type="text" placeholder="Einheit, z. B. €" autocomplete="off" autocapitalize="off">
          </div>
          <div class="chips"><div class="chip" id="gDelete" style="display:none">Löschen</div><div class="chip ok" id="gSave">Speichern</div></div>
        </div>
        <div class="list" id="goals"></div>
      </section>
      </div>
    </div>
    <div class="foot"><span id="foot"></span> &nbsp;·&nbsp; <span id="openSetup" style="text-decoration:underline">Einstellungen</span> &nbsp;·&nbsp; <span id="saverTest" style="text-decoration:underline">Bildschirmschoner</span><span id="camState"></span></div>
  </main>
</div>

<div id="saver"><img id="svA" alt=""><img id="svB" alt=""><video id="svV" muted playsinline></video><div id="saverClock"></div></div>
<div id="setup">
  <div class="sbox">
    <h1>Dashboard einrichten</h1>
    <p>Diese Angaben bleiben nur auf diesem Gerät gespeichert.</p>
    <label>Dein Name (für die Begrüßung)</label><input id="sName" autocomplete="off">
    <label>GitHub-Projekt mit deinen Daten</label><input id="sRepo" autocomplete="off" autocapitalize="off" placeholder="Name/wand-dashboard">
    <label>Zugangsschlüssel (Token)</label><input id="sToken" type="password" autocomplete="off">
    <div id="sMsg"></div>
    <div class="srow"><div class="chip ok" id="sSave">Speichern</div><div class="chip" id="sDemo">Beispiel ansehen</div><div class="chip" id="sCancel">Abbrechen</div></div>
  </div>
</div>

<script>
(function () {
  var WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var WDS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  var MO = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  var REFRESH_MS = 2 * 60 * 1000;     // alle 2 Minuten neue Daten
  var BACK_TO_TODAY_MS = 90 * 1000;   // nach 90 s ohne Berührung zurück zu heute
  var NIGHT_FROM = 24, NIGHT_TO = 0; // Nachtmodus aus (z. B. 23 und 6 = gedimmt zwischen 23 und 6 Uhr)

  var data = { events: [], todos: [], deadlines: [] };
  var offset = 0;      // Tage relativ zu heute
  var idleTimer = null;
  var lastEdit = 0;
  var awakeUntil = 0;   // nach einer Berührung nachts 3 Minuten lang hell bleiben
  document.addEventListener("touchstart", function () { awakeUntil = Date.now() + 180000; document.body.className = ""; }, true);
  document.addEventListener("mousedown", function () { awakeUntil = Date.now() + 180000; document.body.className = ""; }, true);

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return startOfDay(a).getTime() === startOfDay(b).getTime(); }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function toDate(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v);
  }
  function daysUntil(d) { d = toDate(d); return Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000); }
  function shortDate(d) { return WDS[d.getDay()] + ", " + d.getDate() + ". " + MO[d.getMonth()].slice(0, 3) + "."; }

  // ---------- Kalender ----------
  function eventsOn(day) {
    var s = startOfDay(day), e = addDays(s, 1);
    return data.events.filter(function (ev) {
      var a = new Date(ev.start), b = new Date(ev.end || ev.start);
      if (ev.allDay) return a < e && (b > s || sameDay(a, s));
      return a < e && b >= s;
    }).sort(function (x, y) {
      if (x.allDay !== y.allDay) return x.allDay ? -1 : 1;
      return new Date(x.start) - new Date(y.start);
    });
  }

  function renderCalendar() {
    var now = new Date(), day = addDays(startOfDay(now), offset);
    $("wd").textContent = offset === 0 ? "Heute · " + WD[day.getDay()] : offset === 1 ? "Morgen · " + WD[day.getDay()] :
      offset === -1 ? "Gestern · " + WD[day.getDay()] : WD[day.getDay()];
    $("dt").textContent = day.getDate() + ". " + MO[day.getMonth()];
    $("todayBtn").innerHTML = offset === 0 ? "" : "&#8634; Zurück zu heute";

    var strip = "";
    for (var i = -2; i <= 4; i++) {
      var d = addDays(day, i);
      var has = eventsOn(d).length > 0;
      strip += '<div data-o="' + (offset + i) + '" class="' + (i === 0 ? "sel" : "") + '">' + WDS[d.getDay()] +
        "<b>" + d.getDate() + '</b><span class="dot' + (has ? " on" : "") + '"></span></div>';
    }
    $("strip").innerHTML = strip;

    var list = eventsOn(day), html = "";
    list.forEach(function (ev) {
      var a = new Date(ev.start), b = new Date(ev.end || ev.start);
      var cls = "ev";
      if (!ev.allDay && b < now) cls += " past";
      if (!ev.allDay && a <= now && b > now) cls += " now";
      var color = ev.color ? ' style="border-left-color:' + esc(ev.color) + '"' : "";
      html += '<div class="' + cls + '"' + color + '><div class="t">' +
        (ev.allDay ? "<b>ganzt.</b>" : "<b>" + hm(a) + "</b>" + hm(b)) +
        '</div><div><div class="n">' + esc(ev.title) + "</div>" +
        (ev.location || ev.calendar ? '<div class="c">' + esc([ev.location, ev.calendar].filter(Boolean).join(" · ")) + "</div>" : "") +
        "</div></div>";
    });
    $("events").innerHTML = html || '<div class="empty">Keine Termine</div>';
  }

  function go(delta) { offset += delta; renderCalendar(); armIdle(); }
  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { offset = 0; renderCalendar(); }, BACK_TO_TODAY_MS);
  }

  // Wischen
  var sx = null, sy = null;
  var side = $("side");
  side.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  side.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
  });
  $("prev").onclick = function () { go(-1); };
  $("next").onclick = function () { go(1); };
  $("todayBtn").onclick = function () { offset = 0; renderCalendar(); };
  $("strip").onclick = function (e) {
    var t = e.target.closest ? e.target.closest("[data-o]") : null;
    if (t) { offset = parseInt(t.getAttribute("data-o"), 10); renderCalendar(); armIdle(); }
  };

  // ---------- To-dos ----------
  function renderTodos() {
    var open = data.todos.filter(function (t) { return !t.done; });
    var done = data.todos.filter(function (t) { return t.done; }).slice(0, 3);
    open.sort(function (a, b) {
      if (!!b.prio !== !!a.prio) return b.prio ? 1 : -1;
      if (a.due && b.due) return toDate(a.due) - toDate(b.due);
      return a.due ? -1 : b.due ? 1 : 0;
    });
    var html = "";
    open.concat(done).forEach(function (t) {
      var meta = "", late = false;
      if (t.due) {
        var n = daysUntil(t.due);
        late = n < 0 && !t.done;
        meta = n === 0 ? "heute" : n === 1 ? "morgen" : n < 0 ? "überfällig seit " + -n + " Tag" + (n === -1 ? "" : "en") :
          "bis " + shortDate(toDate(t.due));
      }

  // ---------- Verbindung zu GitHub (dort liegen Termine und To-dos) ----------
  var store = {

  };
  var m = /[?&]repo=([\w.-]+\/[\w.-]+)/.exec(location.search);

  var todoSha = null, saving = Promise.resolve();

  function b64decode(s) { return decodeURIComponent(escape(atob(String(s).replace(/\s/g, "")))); }
  function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }

  function api(method, file, body) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open(method, "https://api.github.com/repos/" + store.get("repo") + "/contents/" + file +
        (method === "GET" ? "?t=" + Date.now() : ""));
      x.setRequestHeader("Authorization", "Bearer " + store.get("token"));
      x.setRequestHeader("Accept", "application/vnd.github+json");

        var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}

      };

    saving = saving.then(function () { return attempt(0); }).then(function () { lastEdit = Date.now(); }, function () {
      setFoot("Änderung konnte nicht gespeichert werden", true);
    });
    function attempt(n) {
      return readJson(file, []).then(function (r) {
        var items = Array.isArray(r.value) ? r.value : [];

        var body = { message: message, content: b64encode(JSON.stringify(out, null, 2) + "\n") };

      }).catch(function (e) {

  function loadMediaList() {
    if (!store.get("token") || !store.get("repo")) return;
    api("GET", "bilder").then(function (items) {
      var list = [];
      (Array.isArray(items) ? items : []).forEach(function (f) {
        var m = /\.(jpe?g|png|webp|gif|mp4|webm|m4v)$/i.exec(f.name || "");
        if (f.type === "file" && m && f.size <= MAX_FILE) list.push({ path: f.path, sha: f.sha, video: /mp4|webm|m4v/i.test(m[1]) });
      });
      media = list;
    }, function () {});
  }
  function mediaUrl(item) {
    if (item.url) return Promise.resolve(item.url);
    if (mediaUrls[item.sha]) return Promise.resolve(mediaUrls[item.sha]);
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open("GET", "https://api.github.com/repos/" + store.get("repo") + "/contents/" + item.path.split("/").map(encodeURIComponent).join("/"));
      x.setRequestHeader("Authorization", "Bearer " + store.get("token"));
      x.setRequestHeader("Accept", "application/vnd.github.raw");
      x.responseType = "blob";
      x.onload = function () {
        if (x.status !== 200) return reject(new Error("HTTP " + x.status));
        var type = item.video ? (/webm$/i.test(item.path) ? "video/webm" : "video/mp4") : "";
        var blob = type ? new Blob([x.response], { type: type }) : x.response;
        resolve(mediaUrls[item.sha] = URL.createObjectURL(blob));
      };
      x.onerror = function () { reject(new Error("offline")); };
      x.send();
    });
  }
  function nextSlide() {
    clearTimeout(slideTimer);
    if (!saverOn || !media.length) return;
    slideNo = (slideNo + 1) % media.length;
    var item = media[slideNo], v = $("svV");
    mediaUrl(item).then(function (url) {
      if (!saverOn) return;
      quietUntil = Date.now() + 3000;   // Bildwechsel ändert das Licht im Raum, kurz nicht als Bewegung werten
      if (item.video) {
        v.src = url; v.currentTime = 0;
        v.onended = nextSlide; v.onerror = nextSlide;
        var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
        v.className = "on"; $("svA").className = ""; $("svB").className = "";
        slideTimer = setTimeout(nextSlide, 90000);
      } else {
        var back = svFront === "svA" ? "svB" : "svA", img = $(back);
        img.onload = function () {
          $(svFront).className = ""; img.className = "on"; svFront = back;
          v.className = ""; try { v.pause(); } catch (e) {}
        };
        img.onerror = function () { slideTimer = setTimeout(nextSlide, 500); };
        img.src = url;
        slideTimer = setTimeout(nextSlide, SLIDE_MS);
      }
    }, function () { slideTimer = setTimeout(nextSlide, 3000); });
  }
  function startSaver() {
    if (saverOn || !media.length) return;
    saverOn = true; $("saver").style.display = "block"; $("saverClock").textContent = hm(new Date());
    nextSlide();
  }
  function stopSaver() {
    if (!saverOn) return;
    saverOn = false; clearTimeout(slideTimer); active();
    $("saver").style.display = "none";
    try { $("svV").pause(); } catch (e) {}
    $("svA").className = ""; $("svB").className = ""; $("svV").className = "";
  }
  $("saver").addEventListener("touchstart", function (e) { e.preventDefault(); e.stopPropagation(); stopSaver(); }, true);
  $("saver").addEventListener("mousedown", function (e) { e.preventDefault(); e.stopPropagation(); stopSaver(); }, true);
  $("saverTest").onclick = function () {
    if (!media.length) { setFoot("Noch keine Bilder im Ordner \u201ebilder\u201c", true); loadMediaList(); return; }
    setTimeout(startSaver, 300);
  };
  window.wandMotion = function () { if (Date.now() < quietUntil) return; active(); stopSaver(); };
  setInterval(function () {
    if (saverOn) { $("saverClock").textContent = hm(new Date()); return; }
    if ($("setup").style.display === "block" || document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) { active(); return; }
    if (Date.now() - lastActive > SAVER_AFTER_MS) startSaver();
  }, 5000);
  setInterval(loadMediaList, 10 * 60 * 1000);

  // Bewegung über die Frontkamera: kleines Bild alle 0,7 s mit dem vorherigen vergleichen
  function startCamera() {
    try { if (window.fully && fully.bind) fully.bind("onMotion", "wandMotion();"); } catch (e) {}
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $("camState").textContent = " · Kamera: nicht verfügbar"; return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }, audio: false }).then(function (stream) {
      var W = 32, H = 24, vid = document.createElement("video"), cv = document.createElement("canvas"), prev = null, hits = 0;
      cv.width = W; cv.height = H;
      vid.muted = true; vid.setAttribute("playsinline", ""); vid.srcObject = stream;
      var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {});
      $("camState").textContent = " · Kamera: an";
      setInterval(function () {
        if (vid.readyState < 2) return;
        var ctx = cv.getContext("2d"); ctx.drawImage(vid, 0, 0, W, H);
        var d = ctx.getImageData(0, 0, W, H).data, cur = new Array(W * H), sum = 0, i;
        for (i = 0; i < W * H; i++) { cur[i] = (d[i * 4] + d[i * 4 + 1] * 2 + d[i * 4 + 2]) / 4; sum += cur[i]; }
        if (prev) {
          var shift = (sum - prev.sum) / (W * H), changed = 0;   // gleichmäßige Helligkeitsänderung herausrechnen
          for (i = 0; i < W * H; i++) if (Math.abs(cur[i] - prev.px[i] - shift) > 22) changed++;
          hits = changed > W * H * 0.03 ? hits + 1 : 0;
          if (hits >= 2) { hits = 0; window.wandMotion(); }
        }
        prev = { px: cur, sum: sum };
      }, 700);
    }, function () { $("camState").textContent = " · Kamera: nicht erlaubt"; });
  }

  function sampleData() {
    var t = startOfDay(new Date());
    function at(d, h, m) { var x = addDays(t, d); x.setHours(h, m || 0); return x.toISOString(); }
    return {

        { title: "Mittag mit Lena", start: at(0, 13), end: at(0, 14), calendar: "Privat", color: "#7fd6a4" },
        { title: "Fitnessstudio", start: at(0, 18), end: at(0, 19, 30), calendar: "Privat", color: "#7fd6a4" },
        { title: "Tutorium Statistik", start: at(1, 9), end: at(1, 10, 30), location: "Raum B204", calendar: "Uni", color: "#6ea8fe" },
        { title: "Zahnarzt", start: at(2, 15), end: at(2, 15, 45), calendar: "Privat", color: "#ffc266" },
        { title: "Geburtstag Mama", start: at(3, 0), end: at(4, 0), allDay: true, calendar: "Familie", color: "#ff7a7a" }
      ],
      todos: [
        { id: 1, text: "Übungsblatt 5 Statistik", due: at(2, 23), prio: true },
        { id: 2, text: "Wohnungsversicherung kündigen", due: at(-1, 12) },
        { id: 3, text: "Geschenk für Mama besorgen", due: at(2, 18) },
        { id: 4, text: "Bewerbung Werkstudent abschicken" },
        { id: 5, text: "Wäsche waschen", done: true }
      ],
      spending: { budget: 300, orders: [
        { date: at(-9, 12), shop: "Amazon", amount: 84.5 }, { date: at(-5, 12), shop: "Zalando", amount: 59.9, refund: 59.9 },
        { date: at(-2, 12), shop: "Lieferando", amount: 27.3 }] },
      goals: [
        { id: "g1", title: "Pissgroschen", current: 1250, target: 5000, unit: "€", due: at(200, 0) },
        { id: "g3", title: "Seminararbeit", due: at(32, 0), steps: [
          { t: "Literatur sichten", done: true }, { t: "Theorieteil schreiben", done: true }, { t: "Fragebogen entwerfen" },
          { t: "Befragung durchführen" }, { t: "Auswertung" }, { t: "Abgabe" }] }
      ],
      deadlines: [
        { title: "Abgabe Hausarbeit BWL", date: at(5, 23, 59), type: "due", source: "Moodle" },
        { title: "Klausur Mathe II", date: at(12, 9), type: "exam", allDay: false, source: "Campus" },
        { title: "Rückmeldung Sommersemester", date: at(20, 0), type: "due", source: "Gmail" },
        { title: "Klausur Statistik", date: at(26, 13), type: "exam", allDay: false, source: "Campus" }
      ]
    };
  }

  loadMediaList(); startCamera();
  try { var cached = JSON.parse(store.get("cache") || "null"); if (cached && cached.events) data = cached; } catch (e) {}
  renderAll();
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tick, 15000);
  // Mitternacht: Kalender auf neuen Tag umstellen
  setInterval(function () { if (offset === 0) renderCalendar(); }, 60000);
})();
